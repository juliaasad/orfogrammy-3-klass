<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Орфограммы в корне</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна колонка-тетрадь; слово всегда лежит на линованном листе с красными полями. Тёмная тема — школьная доска и мел. */
:root{
  --desk:#E8EDF6; --paper:#FCFDFF; --ink:#1A2650; --soft:#566189; --rule:#CCD8EE; --margin:#E98585;
  --pen:#1E46C4; --on-pen:#FFFFFF; --pen-tint:#E5EBFB; --red:#CE1F2E; --red-tint:#FCE9EA;
  --good:#127A47; --good-tint:#E2F4EA; --marker:#FFE98A; --marker-ink:#1A2650; --star:#E0A100; --star-off:#D3DAEA;
  --hand:"Bad Script","Segoe Script",cursive; --body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#10201A; --paper:#19302A; --ink:#F0F6EC; --soft:#A9C2B5; --rule:#2B4A3F; --margin:#B4605A;
  --pen:#A8CBFF; --on-pen:#10201A; --pen-tint:#25423F; --red:#FF8F86; --red-tint:#40302C;
  --good:#86E2AC; --good-tint:#1F4436; --marker:#F2E07A; --marker-ink:#10201A; --star:#F4CB55; --star-off:#35574A; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#10201A; --paper:#19302A; --ink:#F0F6EC; --soft:#A9C2B5; --rule:#2B4A3F; --margin:#B4605A;
  --pen:#A8CBFF; --on-pen:#10201A; --pen-tint:#25423F; --red:#FF8F86; --red-tint:#40302C;
  --good:#86E2AC; --good-tint:#1F4436; --marker:#F2E07A; --marker-ink:#10201A; --star:#F4CB55; --star-off:#35574A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:400 17px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:720px;margin:0 auto;display:grid;gap:18px}
#app>*{min-width:0}
h1,h2,h3,p{margin:0}
h1{font:400 clamp(38px,9vw,56px)/1.1 var(--hand);text-wrap:balance}
h2{font:700 22px/1.25 var(--body);text-wrap:balance}
h3{font:600 17px/1.3 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.soft{color:var(--soft)}
.small{font-size:15px}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.head{display:grid;gap:6px}
.sheet{background:var(--paper);border-radius:6px;padding:18px 18px 18px 40px;position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);box-shadow:0 1px 2px rgba(20,40,90,.14)}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:24px;width:2px;background:var(--margin)}
.plain{background:var(--paper);border-radius:6px;padding:18px;box-shadow:0 1px 2px rgba(20,40,90,.14);display:grid;gap:12px}
.plain>*{min-width:0}
.btn{background:var(--pen);color:var(--on-pen);border:0;border-radius:8px;padding:13px 20px;font-weight:600;min-height:50px}
.btn.alt{background:transparent;color:var(--pen);box-shadow:inset 0 0 0 2px var(--pen)}
.btn.link{background:transparent;color:var(--soft);padding:8px 0;min-height:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* главная */
.topics{display:grid;gap:8px}
.topic{display:grid;grid-template-columns:minmax(104px,132px) 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--paper);border:0;border-radius:6px;padding:14px 14px;box-shadow:0 1px 2px rgba(20,40,90,.14);width:100%}
.topic:hover{background:var(--pen-tint)}
.tword{font:400 25px/1.1 var(--hand);color:var(--pen)}
.tword u{color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.tname{font-weight:600;line-height:1.3}
.stars{letter-spacing:1px;font-size:19px;white-space:nowrap;color:var(--star-off)}
.stars b{color:var(--star);font-weight:400}
.exam{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;text-align:left;border:0;border-radius:6px;padding:18px;background:var(--pen);color:var(--on-pen);width:100%}
.exam strong{display:block;font:400 30px/1.15 var(--hand)}
.exam span{font-size:15px}
.exam em{font-style:normal;font-weight:700;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--paper);border:0;border-radius:6px;padding:14px;text-align:left;box-shadow:0 1px 2px rgba(20,40,90,.14);display:grid;gap:2px;align-content:start}
.tile:hover{background:var(--pen-tint)}
.tile b{font-weight:600}
.tile[disabled]{cursor:default;background:var(--paper)}
/* правило */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.flip{border:0;border-radius:8px;background:var(--pen-tint);padding:10px 12px;min-height:74px;text-align:left}
.flip .f{font:700 21px/1.2 var(--body);display:block}
.flip .b{display:none;font-size:15px;line-height:1.3}
.flip.on .b{display:block}
.flip.on .q{display:none}
.flip .q{font-size:14px;color:var(--soft)}
.flip mark,.mk{background:var(--marker);color:var(--marker-ink);border-radius:3px;padding:0 2px}
.rulebox{font:400 22px/36px var(--hand);min-height:36px}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
/* тренировка */
.bar{display:flex;align-items:center;gap:12px}
.cells{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0}
.cell{width:16px;height:16px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.cell.now{box-shadow:inset 0 0 0 2px var(--pen)}
.cell.ok{background:var(--good)}.cell.no{background:var(--red)}.cell.seen{background:var(--pen)}
.q{font-weight:500}
.stage{min-height:108px;display:flex;align-items:center}
.word{font:700 clamp(34px,10vw,50px)/1.2 var(--body);letter-spacing:.02em;overflow-wrap:anywhere}
.word.sent{font:600 clamp(22px,6vw,28px)/36px var(--body);letter-spacing:0}
.slot{display:inline-block;width:.72em;height:.95em;vertical-align:-.1em;border-bottom:4px solid var(--pen);background:var(--marker);opacity:.8;margin:0 2px;border-radius:2px 2px 0 0}
.lt{color:var(--good)}
.fix{display:inline-flex;flex-direction:column-reverse;align-items:center;vertical-align:baseline;line-height:1}
.fix s{color:var(--soft);text-decoration-color:var(--red);text-decoration-thickness:3px;font-size:.62em}
.fix b{color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:var(--paper);border:0;box-shadow:inset 0 0 0 2px var(--rule);border-radius:10px;min-width:72px;min-height:64px;padding:8px 18px;font-weight:700;font-size:28px}
.opt.txt{font-size:18px;font-weight:600}
.opt:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--pen);background:var(--pen-tint)}
.list{display:grid;gap:8px}
.ans{display:block;width:100%;background:var(--paper);border:0;box-shadow:inset 0 0 0 2px var(--rule);border-radius:10px;padding:13px 15px;text-align:left;font-weight:500;min-height:52px;overflow-wrap:anywhere}
.ans:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--pen);background:var(--pen-tint)}
.ans.ok{box-shadow:inset 0 0 0 2px var(--good);background:var(--good-tint)}
.ans.no{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-tint)}
.ans.pick{box-shadow:inset 0 0 0 2px var(--pen);background:var(--pen-tint)}
.ans[disabled]{cursor:default;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:0;box-shadow:inset 0 0 0 2px var(--rule);border-radius:8px;padding:9px 13px;font-weight:600;font-size:19px;min-height:48px}
.chip.on{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-tint)}
.chip.ok{box-shadow:inset 0 0 0 2px var(--good);background:var(--good-tint)}
.chip.no{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-tint)}
.chip[disabled]{cursor:default;color:inherit}
.chip small{display:block;font-size:14px;font-weight:600;color:var(--red)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bucket{background:var(--paper);box-shadow:inset 0 0 0 2px var(--rule);border:0;border-radius:10px;padding:10px 12px;min-height:96px;text-align:left;display:flex;flex-direction:column;gap:5px}
.bucket:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--pen);background:var(--pen-tint)}
.bucket[disabled]{cursor:default;color:inherit}
.bucket b{font-size:15px;line-height:1.25}
.bucket span{font-size:16px;font-weight:600}
.bucket span.bad{color:var(--red)}
.fb{border-radius:8px;padding:14px;display:grid;gap:10px;background:var(--good-tint)}
.fb.bad{background:var(--red-tint)}
.fb strong{font:400 26px/1.1 var(--hand);color:var(--good)}
.fb.bad strong{color:var(--red)}
input.typed{width:100%;font:700 26px/1.2 var(--body);padding:12px 14px;border:0;border-radius:10px;box-shadow:inset 0 0 0 2px var(--rule);background:var(--paper);color:var(--ink)}
/* итог */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font:700 54px/1 var(--body);font-variant-numeric:tabular-nums}
.stamp{font:400 44px/1 var(--hand);color:var(--red);transform:rotate(-6deg);display:inline-block;margin:6px 0 6px 10px;animation:pop .35s ease-out}
@keyframes pop{from{transform:rotate(-6deg) scale(1.4);opacity:.3}}
.tbl{display:grid;gap:8px}
.tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:16px}
.track{grid-column:1/-1;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--good)}
.track i.low{background:var(--red)}
.rev{margin:0;padding-left:20px;display:grid;gap:8px}
details{background:var(--paper);border-radius:6px;padding:14px 18px;box-shadow:0 1px 2px rgba(20,40,90,.14)}
summary{font-weight:600;cursor:pointer;min-height:30px}
details>div{display:grid;gap:12px;margin-top:12px}
.dict{font-size:20px;line-height:1.7}
.dict.show i{font-style:normal;background:var(--marker);color:var(--marker-ink);border-radius:2px;padding:0 1px}
.dict i{font-style:normal}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600}
@media (max-width:520px){
  .topic{grid-template-columns:1fr auto}.tword{grid-column:1/-1}
  .sheet{padding-left:34px;padding-right:14px}.sheet::before{left:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function startRound(mode,topic,tasks){R={mode,topic,tasks,i:0,log:[],base:tasks.length};C={};V={view:'round'};render();window.scrollTo(0,0)}
function cellsHTML(){let h='';for(let i=0;i<R.base;i++){const l=R.log[i];let c='';if(l)c=R.mode==='exam'?'seen':(l.ok?'ok':'no');else if(i===R.i)c='now';h+=`<i class="cell ${c}"></i>`}return h}
function wordHTML(it,ans,step,reveal){
  const parts=it.g.split('_');let h='';
  parts.forEach((p,i)=>{h+=esc(p);if(i<parts.length-1){
    if(i<ans.length){const a=ans[i],r=it.a[i];
      if(!reveal)h+=`<span>${esc(a)}</span>`;
      else if(a===r)h+=`<span class="lt">${esc(a)}</span>`;
      else if(a==='')h+=`<span class="fix"><b>${esc(r)}</b></span>`;
      else h+=`<span class="fix"><s>${esc(a)}</s>${r?`<b>${esc(r)}</b>`:''}</span>`;
    } else h+=`<span class="slot" aria-label="пропуск"></span>`;
  }});
  return `<div class="word${it.g.includes(' ')?' sent':''}">${h}</div>`;
}
function fb(ok,why,extra){return `<div class="fb ${ok?'':'bad'}"><strong>${ok?'Верно!':'Вот как правильно'}</strong>${why?`<p>${why}</p>`:''}${extra||''}<div><button class="btn" data-do="next" data-next>Дальше →</button></div></div>`}
function strip(s){return R.mode==='exam'?s.replace(/́/g,''):s}
function taskHTML(t){
  const train=R.mode!=='exam';
  if(t.t==='gap'||(t.t==='rule'&&C.stage==='gap')){
    const it=t.item,ans=C.ans||[],step=ans.length,done=C.done;
    const opts=done?'':`<div class="opts">${it.o[step].map(x=>`<button class="opt ${x===''?'txt':''}" data-do="letter" data-v="${esc(x)}" data-key="${esc(x)}">${x===''?'ничего':esc(x)}</button>`).join('')}</div>`;
    const q=it.a[0]===''||it.o[0].includes('')?'Нужна ли здесь буква?':(it.a.length>1?'Вставь буквы по очереди.':'Какая буква пропущена?');
    return `<p class="q">${t.t==='rule'?'А теперь вставь букву.':q}</p><div class="sheet"><div class="stage">${wordHTML(it,ans,step,train&&done)}</div></div>${opts}${done&&train?fb(C.ok,(t.t==='rule'?`Правило: ${RULE_NAME[it.rule].toLowerCase()}. `:'')+it.why):''}`;
  }
  if(t.t==='rule'){
    const it=t.item;
    return `<p class="q">Какое правило нужно, чтобы вставить букву?</p><div class="sheet"><div class="stage">${wordHTML(it,[],0)}</div></div>
    <div class="list">${['v','c','s','d'].map(k=>`<button class="ans" data-do="rulepick" data-v="${k}">${RULE_NAME[k]}</button>`).join('')}</div>`;
  }
  if(t.t==='check'||t.t==='mcq'){
    const head=t.t==='check'?`<p class="q">Какое слово проверяет букву в корне?</p><div class="sheet"><div class="stage"><div class="word">${esc(t.w)}</div></div></div>`:`<p class="q">${esc(t.q)}</p>`;
    return `${head}<div class="list">${t.opts.map(o=>{let c='';if(C.done&&train)c=o===t.ok?'ok':(o===C.pick?'no':'');return `<button class="ans ${c}" data-do="pick" data-v="${esc(o)}" ${C.done?'disabled':''}>${esc(strip(o))}</button>`}).join('')}</div>${C.done&&train?fb(C.ok,t.why):''}`;
  }
  if(t.t==='row'){
    return `<p class="q">${t.q}</p><div class="list">${t.rows.map((r,i)=>{let c='';if(C.done&&train)c=i===t.correct?'ok':(i===C.pick?'no':'');return `<button class="ans ${c}" data-do="rowpick" data-v="${i}" ${C.done?'disabled':''}>${r.map(x=>esc(x.g)).join(', ')}</button>`}).join('')}</div>${C.done&&train?fb(C.ok,t.why):''}`;
  }
  if(t.t==='typo'){
    C.on=C.on||{};
    const chips=t.words.map((w,i)=>{let c=C.on[i]?'on':'',sm='';if(C.done&&train){if(w.bad){c=C.on[i]?'ok':'no';sm=`<small>${esc(w.right)}</small>`}else c=C.on[i]?'no':''}return `<button class="chip ${c}" data-do="toggle" data-v="${i}" ${C.done?'disabled':''} aria-pressed="${!!C.on[i]}">${esc(w.show)}${sm}</button>`}).join('');
    return `<p class="q">${t.q}</p><div class="chips">${chips}</div>${C.done?(train?fb(C.ok,C.ok?'Все ошибки найдены.':'Сравни с правильным написанием под словами.'):''):`<div><button class="btn" data-do="typodone" data-next>Проверить</button></div>`}`;
  }
  if(t.t==='sort'){
    C.pos=C.pos||0;C.put=C.put||t.cols.map(()=>[]);
    const cur=t.items[C.pos];
    const showW=x=>{const it=x[0];if(!t.mark)return esc(fill(it));const p=it.g.split('_');return esc(p[0])+`<span class="mk">${esc(it.a[0])}</span>`+esc(p[1]||'')};
    const buckets=t.cols.map((c,i)=>`<button class="bucket" data-do="put" data-v="${i}" ${C.done?'disabled':''}><b>${c}</b>${C.put[i].map(x=>`<span class="${train&&x[1]!==i?'bad':''}">${esc(fill(x[0]))}${train&&x[1]!==i?' ✗':''}</span>`).join('')}</button>`).join('');
    return `<p class="q">${t.q}</p>${C.done?'':`<div class="sheet"><div class="stage"><div class="word">${showW(cur)}</div></div></div><p class="small soft">Нажми на нужный столбик. Слово ${C.pos+1} из ${t.items.length}.</p>`}<div class="buckets">${buckets}</div>${C.done&&train?fb(C.ok,C.ok?'Все слова на своих местах.':sortWhy(t)):''}`;
  }
  if(t.t==='type'){
    return `<p class="q">Отгадай и напиши слово. Это словарное слово.</p><div class="sheet"><div class="stage"><div class="word sent">${esc(t.q)}</div></div></div>
    ${C.done?(train?fb(C.ok,C.ok?`Пишем: ${esc(t.a)}.`:`Написано «${esc(C.val)}». Правильно: ${esc(t.a)}.`):''):`<form id="tf" autocomplete="off"><input class="typed" id="typed" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Слово"><div style="margin-top:10px"><button class="btn" type="submit">Проверить</button></div></form>`}`;
  }
}
function sortWhy(t){const wrong=C.wrong||[];return wrong.map(x=>`${fill(x[0])}: ${t.cols[x[1]].toLowerCase()}`).join('; ')+'.'}
function roundView(){
  const t=R.tasks[R.i];const title=R.mode==='exam'?'Пробная контрольная':(R.mode==='mist'?'Мои ошибки':NAMES[R.topic]);
  const retry=t.retry?'<p class="small soft">Ещё раз, чтобы закрепить.</p>':'';
  return `<div class="bar"><button class="btn link" data-do="quit" aria-label="Выйти">← Выйти</button><div class="cells" aria-hidden="true">${cellsHTML()}</div><span class="soft small">${Math.min(R.i+1,R.base)}/${R.base}</span></div>
  <p class="soft small">${title}</p>${retry}<section class="stack">${taskHTML(t)}</section>`;
}
function reviewLine(t){
  if(t.t==='gap')return `<b>${esc(fill(t.item))}</b>. ${esc(t.item.why)}`;
  if(t.t==='rule')return `<b>${esc(fill(t.item))}</b>: ${RULE_NAME[t.item.rule]}. ${esc(t.item.why)}`;
  if(t.t==='check')return `<b>${esc(t.w)}</b> проверяем словом «${esc(t.ok)}». ${esc(t.why)}`;
  if(t.t==='mcq')return `${esc(t.q)} <b>${esc(t.ok)}</b>. ${esc(t.why)}`;
  if(t.t==='row')return `${esc(t.q)} ${esc(t.why)}`;
  if(t.t==='typo')return `Ошибки были в словах: ${t.words.filter(w=>w.bad).map(w=>`${esc(w.show)} → <b>${esc(w.right)}</b>`).join(', ')}.`;
  if(t.t==='sort')return `Как разложить: ${t.cols.map((c,i)=>`<b>${esc(c)}</b>: ${t.items.filter(x=>x[1]===i).map(x=>esc(fill(x[0]))).join(', ')}`).join('; ')}.`;
  if(t.t==='type')return `${esc(t.q)}: <b>${esc(t.a)}</b>.`;
  return '';
}
function resultView(){
  const first=R.log.filter(l=>!l.t.retry);const right=first.filter(l=>l.ok).length,of=first.length;
  const pct=of?right/of:0;
  let msg=pct===1?'Без единой ошибки.':pct>=.8?'Хороший результат. Посмотри, где были ошибки.':pct>=.5?'Половина пути пройдена. Прочитай правило и попробуй ещё раз.':'Вернись к правилу, разбери примеры и попробуй снова.';
  let stamp=pct===1?'<span class="stamp">Отлично!</span>':pct>=.8?'<span class="stamp">Хорошо!</span>':'';
  let body='';
  if(R.mode==='exam'){
    const rows=['d','c','s','v','r'].map(k=>{const a=first.filter(l=>l.t.topic===k);if(!a.length)return '';const r=a.filter(l=>l.ok).length;return `<div class="tr"><span>${NAMES[k]}</span><span>${r} из ${a.length}</span><div class="track"><i class="${r/a.length<.6?'low':''}" style="width:${r/a.length*100}%"></i></div></div>`}).join('');
    const wrong=first.filter(l=>!l.ok);
    body=`<section class="plain"><h3>По темам</h3><div class="tbl">${rows}</div></section>${wrong.length?`<section class="plain"><h3>Разбор ошибок</h3><ol class="rev">${wrong.map(l=>`<li>${reviewLine(l.t)}</li>`).join('')}</ol></section>`:''}`;
  }
  const again=R.mode==='exam'?`<button class="btn" data-do="exam">Новый вариант</button>`:(R.mode==='mist'?(M.mist.length?`<button class="btn" data-do="mist">Ещё раз</button>`:''):`<button class="btn" data-do="start" data-v="${R.topic}">Ещё раз, с новыми словами</button>`);
  const rule=R.mode==='train'?`<button class="btn alt" data-do="topic" data-v="${R.topic}">К правилу</button>`:'';
  return `<header class="head"><p class="soft small">${R.mode==='exam'?'Пробная контрольная':(R.mode==='mist'?'Мои ошибки':NAMES[R.topic])}</p><div class="score"><span class="big">${right} из ${of}</span>${stamp}</div><p>${R.mode==='mist'&&!M.mist.length?'Список ошибок пуст. Все слова исправлены.':msg}</p>${R.mode==='train'?`<p>${stars(R.st)}</p>`:''}</header>${body}<div class="row">${again}${rule}<button class="btn alt" data-do="home">На главную</button></div>`;
}
function render(){
  if(V.view==='home')$.innerHTML=home();
  else if(V.view==='topic')$.innerHTML=topicView(V.k);
  else if(V.view==='grown')$.innerHTML=grown();
  else if(V.view==='round'){$.innerHTML=roundView();const i=document.getElementById('typed');if(i)i.focus();const n=$.querySelector('[data-next].btn');if(n&&C.done)n.focus()}
  else if(V.view==='result')$.innerHTML=resultView();
}
function finish(ok){
  const t=R.tasks[R.i];C.done=true;C.ok=ok;
  if(!t.retry)R.log.push({t,ok});
  const it=t.item;
  if(R.mode!=='exam'){
    if(!ok&&it)mistake(it,true);
    if(ok&&it&&R.mode==='mist')mistake(it,false);
    if(t.t==='typo'&&!ok)t.words.filter(w=>w.bad&&!C.on[t.words.indexOf(w)]).forEach(w=>mistake(w.it,true));
    if(!ok&&it&&!t.retry)R.tasks.push({...t,retry:true});
  } else {if(!ok&&it)mistake(it,true)}
  if(R.mode==='exam')next();else render();
}
function next(){
  R.i++;C={};
  if(R.i>=R.tasks.length){
    const first=R.log.filter(l=>!l.t.retry),r=first.filter(l=>l.ok).length;
    if(R.mode==='train'){const p=r/first.length;R.st=p===1?3:p>=.8?2:p>=.5?1:0;M.stars[R.topic]=Math.max(M.stars[R.topic]||0,R.st);save()}
    if(R.mode==='exam'){M.exam={best:Math.max(M.exam?M.exam.best:0,r),of:first.length};save()}
    V={view:'result'};render();window.scrollTo(0,0);return;
  }
  render();window.scrollTo(0,0);
}
const norm=s=>s.trim().toLowerCase().replace(/ё/g,'е');
const ACT={
  home(){go({view:'home'})},
  topic(v){go({view:'topic',k:v})},
  grown(){go({view:'grown'})},
  flip(v,el){el.classList.toggle('on')},
  dict(v){document.getElementById('dict'+v).classList.toggle('show');const n=document.getElementById('nt'+v);n.hidden=!n.hidden},
  confirm(){V.confirm=true;render()},unconfirm(){V.confirm=false;render()},
  reset(){M={stars:{},mist:[],exam:null};save();go({view:'home'})},
  start(v){startRound('train',v,topicRound(v))},
  exam(){startRound('exam',null,examRound())},
  mist(){const tasks=shuffle(M.mist.map(id=>ITEMS[id]).filter(Boolean)).slice(0,15).map(it=>gapTask(it,it.rule));if(tasks.length)startRound('mist',null,tasks)},
  quit(){go({view:'home'})},
  next(){next()},
  letter(v){const t=R.tasks[R.i],it=t.item;C.ans=C.ans||[];C.ans.push(v);if(C.ans.length>=it.a.length){const ok=C.ans.every((x,i)=>x===it.a[i])&&(t.t!=='rule'||C.ruleOk);finish(ok)}else render()},
  rulepick(v){const t=R.tasks[R.i];C.ruleOk=v===t.item.rule;C.stage='gap';C.ruleV=v;render()},
  pick(v){const t=R.tasks[R.i];C.pick=v;finish(v===t.ok)},
  rowpick(v){const t=R.tasks[R.i];C.pick=+v;finish(+v===t.correct)},
  toggle(v){C.on=C.on||{};C.on[v]=!C.on[v];render()},
  typodone(){const t=R.tasks[R.i];C.on=C.on||{};finish(t.words.every((w,i)=>!!C.on[i]===w.bad))},
  put(v){const t=R.tasks[R.i];const x=t.items[C.pos];C.put[+v].push(x);if(x[1]!==+v){C.wrong=C.wrong||[];C.wrong.push(x)}C.pos++;if(C.pos>=t.items.length)finish(!(C.wrong&&C.wrong.length));else render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;ACT[b.dataset.do](b.dataset.v,b)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='tf'){const t=R.tasks[R.i],val=document.getElementById('typed').value;if(!val.trim())return;C.val=val;finish(norm(val)===norm(t.a))}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey)return;
  if(e.key==='Enter'){const n=$.querySelector('[data-next]');if(n&&document.activeElement!==n){e.preventDefault();n.click()}return}
  const k=e.key.toLowerCase();const b=[...$.querySelectorAll('[data-key]')].find(x=>x.dataset.key===k);if(b)b.click();
});
render();
</script>

</body>
